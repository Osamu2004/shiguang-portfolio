name: ShiguangHealth
options:
  bundleIdPrefix: com.osamu2004.shiguang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  ShiguangHealth:
    type: application
    platform: iOS
    sources: [ShiguangHealth]
    info:
      path: ShiguangHealth/Info.plist
    entitlements:
      path: ShiguangHealth/ShiguangHealth.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osamu2004.shiguang.health
        PRODUCT_NAME: "拾光健康"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: HealthKit.framework

