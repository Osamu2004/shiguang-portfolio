name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Shiguang-Windows
            path: dist/Shiguang
          - os: macos-latest
            artifact: Shiguang-macOS
            path: dist/Shiguang.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --name Shiguang --collect-all webview --add-data "static;static" --add-data "resources;resources" desktop.py
      - name: Build macOS
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name Shiguang --collect-all webview --add-data "static:static" --add-data "resources:resources" desktop.py
      - name: Package Windows update
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Shiguang -DestinationPath Shiguang-Windows.zip
      - name: Package macOS update
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Shiguang.app Shiguang-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.artifact }}
          path: Shiguang-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: release
      - name: Create checksums
        run: |
          cd release
          sha256sum Shiguang-Windows.zip > Shiguang-Windows.zip.sha256
          sha256sum Shiguang-macOS.zip > Shiguang-macOS.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --generate-notes --title "拾光 ${{ github.ref_name }}"
